<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#100b20" />
      <stop offset="50%" style="stop-color:#161035" />
      <stop offset="100%" style="stop-color:#0e0c1c" />
    </linearGradient>
    <linearGradient id="nodeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a5b4fc" />
      <stop offset="100%" style="stop-color:#818cf8" />
    </linearGradient>
    <linearGradient id="nodeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8" />
      <stop offset="100%" style="stop-color:#6366f1" />
    </linearGradient>
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0.3" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="30%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:0.18" />
      <stop offset="100%" style="stop-color:#818cf8;stop-opacity:0" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="80" fill="url(#bg)"/>

  <!-- Ambient glow -->
  <circle cx="200" cy="200" r="120" fill="url(#centerGlow)"/>

  <!-- Subtle orbs -->
  <circle cx="80" cy="80" r="80" fill="#6366f1" opacity="0.04"/>
  <circle cx="320" cy="320" r="70" fill="#8b5cf6" opacity="0.03"/>

  <!-- Heartbeat rings — centered, very subtle -->
  <g opacity="0.08">
    <circle cx="200" cy="200" r="100" fill="none" stroke="#6366f1" stroke-width="0.6"/>
    <circle cx="200" cy="200" r="130" fill="none" stroke="#818cf8" stroke-width="0.35"/>
    <circle cx="200" cy="200" r="160" fill="none" stroke="#a78bfa" stroke-width="0.2"/>
  </g>

  <!-- === THE GRAPH MARK === -->
  <!-- A constellation of 7 nodes forming a memorable, slightly asymmetric shape -->
  <!-- Like a simplified neural cluster / memory network -->

  <!-- Edges (connections) — drawn first, behind nodes -->
  <g stroke="url(#edgeGrad)" fill="none" stroke-width="2.5" stroke-linecap="round">
    <!-- Central hub connections -->
    <line x1="200" y1="185" x2="138" y2="132"/>
    <line x1="200" y1="185" x2="270" y2="128"/>
    <line x1="200" y1="185" x2="130" y2="228"/>
    <line x1="200" y1="185" x2="278" y2="235"/>
    <line x1="200" y1="185" x2="168" y2="290"/>
    <line x1="200" y1="185" x2="248" y2="282"/>

    <!-- Outer connections — creating triangles for visual interest -->
    <line x1="138" y1="132" x2="270" y2="128" stroke-opacity="0.25" stroke-width="1.5"/>
    <line x1="130" y1="228" x2="168" y2="290" stroke-opacity="0.25" stroke-width="1.5"/>
    <line x1="278" y1="235" x2="248" y2="282" stroke-opacity="0.25" stroke-width="1.5"/>
    <line x1="138" y1="132" x2="130" y2="228" stroke-opacity="0.2" stroke-width="1.2"/>
    <line x1="270" y1="128" x2="278" y2="235" stroke-opacity="0.2" stroke-width="1.2"/>
  </g>

  <!-- Nodes -->
  <!-- Center node — largest, the "core memory" -->
  <circle cx="200" cy="185" r="18" fill="url(#nodeGrad1)" filter="url(#bigGlow)"/>
  <circle cx="200" cy="185" r="8" fill="white" opacity="0.15"/>

  <!-- Upper nodes -->
  <circle cx="138" cy="132" r="11" fill="url(#nodeGrad2)" filter="url(#glow)"/>
  <circle cx="270" cy="128" r="12" fill="url(#nodeGrad1)" filter="url(#glow)"/>

  <!-- Middle nodes -->
  <circle cx="130" cy="228" r="10" fill="url(#nodeGrad2)" filter="url(#glow)"/>
  <circle cx="278" cy="235" r="11" fill="url(#nodeGrad1)" filter="url(#glow)"/>

  <!-- Lower nodes -->
  <circle cx="168" cy="290" r="9" fill="url(#nodeGrad2)" filter="url(#glow)"/>
  <circle cx="248" cy="282" r="10" fill="url(#nodeGrad1)" filter="url(#glow)"/>

  <!-- Inner glow dots on nodes -->
  <circle cx="138" cy="132" r="3.5" fill="white" opacity="0.12"/>
  <circle cx="270" cy="128" r="4" fill="white" opacity="0.1"/>
  <circle cx="130" cy="228" r="3" fill="white" opacity="0.1"/>
  <circle cx="278" cy="235" r="3.5" fill="white" opacity="0.1"/>
  <circle cx="168" cy="290" r="2.5" fill="white" opacity="0.1"/>
  <circle cx="248" cy="282" r="3" fill="white" opacity="0.1"/>

  <!-- Grid dots -->
  <g opacity="0.05">
    <circle cx="50" cy="45" r="1" fill="#a78bfa"/>
    <circle cx="100" cy="45" r="1" fill="#a78bfa"/>
    <circle cx="200" cy="45" r="1" fill="#a78bfa"/>
    <circle cx="300" cy="45" r="1" fill="#a78bfa"/>
    <circle cx="350" cy="45" r="1" fill="#a78bfa"/>
    <circle cx="50" cy="355" r="1" fill="#a78bfa"/>
    <circle cx="100" cy="355" r="1" fill="#a78bfa"/>
    <circle cx="200" cy="355" r="1" fill="#a78bfa"/>
    <circle cx="300" cy="355" r="1" fill="#a78bfa"/>
    <circle cx="350" cy="355" r="1" fill="#a78bfa"/>
  </g>
</svg>
