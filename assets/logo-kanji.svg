<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#100b20" />
      <stop offset="50%" style="stop-color:#161035" />
      <stop offset="100%" style="stop-color:#0e0c1c" />
    </linearGradient>
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c4b5fd" />
      <stop offset="40%" style="stop-color:#a5b4fc" />
      <stop offset="100%" style="stop-color:#6366f1" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="48%" r="35%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:0.14" />
      <stop offset="100%" style="stop-color:#818cf8;stop-opacity:0" />
    </radialGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="nodeGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="80" fill="url(#bg)"/>

  <!-- Ambient glow -->
  <circle cx="200" cy="192" r="120" fill="url(#centerGlow)"/>

  <!-- Subtle orbs -->
  <circle cx="75" cy="80" r="80" fill="#6366f1" opacity="0.04"/>
  <circle cx="330" cy="320" r="65" fill="#8b5cf6" opacity="0.03"/>

  <!-- === SIMPLIFIED 記 — strokes dissolving into graph nodes at the tips === -->
  <!-- The twist: clean kanji strokes, but endpoints dissolve into glowing memory nodes -->
  <!-- Memory (記) literally becoming a knowledge graph -->

  <g filter="url(#softGlow)">
    <g stroke="url(#strokeGrad)" fill="none" stroke-linecap="round" stroke-width="9">

      <!-- LEFT: 言 radical — simplified to vertical + 3 horizontals -->
      <line x1="112" y1="100" x2="112" y2="275"/>
      <line x1="95" y1="100" x2="180" y2="100"/>
      <line x1="112" y1="170" x2="175" y2="170"/>
      <line x1="112" y1="240" x2="175" y2="240"/>

      <!-- RIGHT: 己 radical — simplified hook -->
      <line x1="210" y1="125" x2="310" y2="125"/>
      <line x1="210" y1="125" x2="210" y2="200"/>
      <line x1="210" y1="200" x2="300" y2="200"/>
      <line x1="300" y1="200" x2="300" y2="265"/>
      <path d="M 300,265 Q 300,290 275,295 Q 255,298 238,290" stroke-width="8.5" fill="none"/>
    </g>
  </g>

  <!-- === DISSOLVING NODES — stroke tips become memory nodes === -->

  <!-- Top-left corner node -->
  <circle cx="95" cy="100" r="5.5" fill="#c4b5fd" filter="url(#nodeGlow)" opacity="0.85"/>

  <!-- End of top horizontal (言) → drifts into space -->
  <circle cx="180" cy="100" r="4" fill="#a5b4fc" filter="url(#nodeGlow)" opacity="0.6"/>
  <line x1="180" y1="100" x2="198" y2="82" stroke="#818cf8" stroke-width="1.2" opacity="0.22" stroke-linecap="round"/>
  <circle cx="198" cy="82" r="2.5" fill="#818cf8" filter="url(#nodeGlow)" opacity="0.35"/>

  <!-- End of middle horizontal (言) -->
  <circle cx="175" cy="170" r="3.5" fill="#a5b4fc" filter="url(#nodeGlow)" opacity="0.5"/>

  <!-- End of bottom horizontal (言) → drifts down -->
  <circle cx="175" cy="240" r="3.5" fill="#a5b4fc" filter="url(#nodeGlow)" opacity="0.5"/>
  <line x1="175" y1="240" x2="192" y2="262" stroke="#818cf8" stroke-width="1" opacity="0.15" stroke-linecap="round"/>
  <circle cx="192" cy="262" r="2" fill="#818cf8" opacity="0.25"/>

  <!-- Bottom of vertical (言) → node drifts down-left -->
  <circle cx="112" cy="275" r="4.5" fill="#a5b4fc" filter="url(#nodeGlow)" opacity="0.65"/>
  <line x1="112" y1="275" x2="92" y2="298" stroke="#818cf8" stroke-width="1" opacity="0.18" stroke-linecap="round"/>
  <circle cx="92" cy="298" r="2.5" fill="#818cf8" filter="url(#nodeGlow)" opacity="0.3"/>

  <!-- End of 己 top horizontal → node floats right -->
  <circle cx="310" cy="125" r="5" fill="#c4b5fd" filter="url(#nodeGlow)" opacity="0.75"/>
  <line x1="310" y1="125" x2="332" y2="108" stroke="#818cf8" stroke-width="1.2" opacity="0.22" stroke-linecap="round"/>
  <circle cx="332" cy="108" r="2.5" fill="#818cf8" filter="url(#nodeGlow)" opacity="0.35"/>

  <!-- End of 己 hook → nodes scatter -->
  <circle cx="238" cy="290" r="4.5" fill="#a5b4fc" filter="url(#nodeGlow)" opacity="0.7"/>
  <line x1="238" y1="290" x2="218" y2="314" stroke="#818cf8" stroke-width="1" opacity="0.16" stroke-linecap="round"/>
  <circle cx="218" cy="314" r="2.2" fill="#818cf8" filter="url(#nodeGlow)" opacity="0.28"/>
  <line x1="238" y1="290" x2="262" y2="312" stroke="#818cf8" stroke-width="0.8" opacity="0.12" stroke-linecap="round"/>
  <circle cx="262" cy="312" r="1.8" fill="#a78bfa" opacity="0.22"/>

  <!-- One floating connection between scattered nodes — tying it together -->
  <line x1="92" y1="298" x2="218" y2="314" stroke="#6366f1" stroke-width="0.6" opacity="0.08" stroke-linecap="round"/>

  <!-- Grid dots -->
  <g opacity="0.04">
    <circle cx="50" cy="45" r="1" fill="#a78bfa"/>
    <circle cx="150" cy="45" r="1" fill="#a78bfa"/>
    <circle cx="250" cy="45" r="1" fill="#a78bfa"/>
    <circle cx="350" cy="45" r="1" fill="#a78bfa"/>
    <circle cx="50" cy="355" r="1" fill="#a78bfa"/>
    <circle cx="150" cy="355" r="1" fill="#a78bfa"/>
    <circle cx="250" cy="355" r="1" fill="#a78bfa"/>
    <circle cx="350" cy="355" r="1" fill="#a78bfa"/>
  </g>
</svg>
