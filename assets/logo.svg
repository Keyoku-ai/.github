<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0a1e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#151030;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d0b1a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="k" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c4b5fd;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="80" fill="url(#bg)"/>

  <!-- Subtle orbs -->
  <circle cx="80" cy="80" r="120" fill="#6366f1" opacity="0.08"/>
  <circle cx="320" cy="320" r="100" fill="#8b5cf6" opacity="0.06"/>

  <!-- Knowledge graph nodes (subtle background) -->
  <g opacity="0.15">
    <circle cx="100" cy="120" r="4" fill="#818cf8"/>
    <circle cx="160" cy="80" r="3" fill="#a78bfa"/>
    <circle cx="300" cy="300" r="4" fill="#818cf8"/>
    <circle cx="260" cy="330" r="3" fill="#a78bfa"/>
    <line x1="100" y1="120" x2="160" y2="80" stroke="#6366f1" stroke-width="1"/>
    <line x1="300" y1="300" x2="260" y2="330" stroke="#6366f1" stroke-width="1"/>
  </g>

  <!-- K lettermark -->
  <text x="200" y="260" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Fira Code', Menlo, monospace"
        font-size="220" font-weight="700" fill="url(#k)" text-anchor="middle" letter-spacing="-8">
    K
  </text>

  <!-- Small heartbeat ring -->
  <circle cx="310" cy="130" r="20" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.3"/>
  <circle cx="310" cy="130" r="35" fill="none" stroke="#818cf8" stroke-width="0.8" opacity="0.15"/>
  <circle cx="310" cy="130" r="4" fill="#a78bfa" opacity="0.5"/>
</svg>
