<svg xmlns="http://www.w3.org/2000/svg" width="800" height="280" viewBox="0 0 800 280">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0a1e;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#151030;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d0b1a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="nodeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:0.2" />
    </linearGradient>
    <filter id="blur1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" />
    </filter>
  </defs>
  <style>
    .orb1 { animation: float1 8s ease-in-out infinite; }
    .orb2 { animation: float2 10s ease-in-out infinite; }
    .orb3 { animation: float3 7s ease-in-out infinite; }
    .orb4 { animation: float4 9s ease-in-out infinite; }
    .pulse { animation: pulse 4s ease-in-out infinite; }
    .pulse2 { animation: pulse 4s ease-in-out infinite; animation-delay: 2s; }
    .particle { animation: drift 14s linear infinite; }
    .signal { animation: signalPulse 3s ease-in-out infinite; }
    .conn { animation: connFade 5s ease-in-out infinite; }
    @keyframes float1 {
      0%, 100% { transform: translate(0, 0); opacity: 0.15; }
      50% { transform: translate(15px, -10px); opacity: 0.28; }
    }
    @keyframes float2 {
      0%, 100% { transform: translate(0, 0); opacity: 0.1; }
      50% { transform: translate(-12px, 8px); opacity: 0.2; }
    }
    @keyframes float3 {
      0%, 100% { transform: translate(0, 0); opacity: 0.12; }
      50% { transform: translate(8px, -12px); opacity: 0.24; }
    }
    @keyframes float4 {
      0%, 100% { transform: translate(0, 0); opacity: 0.08; }
      50% { transform: translate(-6px, 6px); opacity: 0.16; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; r: 3; }
      50% { opacity: 0.8; r: 4.5; }
    }
    @keyframes signalPulse {
      0%, 100% { opacity: 0.1; }
      50% { opacity: 0.4; }
    }
    @keyframes drift {
      0% { transform: translateX(-40px); opacity: 0; }
      8% { opacity: 0.5; }
      92% { opacity: 0.5; }
      100% { transform: translateX(840px); opacity: 0; }
    }
    @keyframes connFade {
      0%, 100% { opacity: 0.06; }
      50% { opacity: 0.15; }
    }
  </style>

  <!-- Background -->
  <rect width="800" height="280" rx="16" fill="url(#bg)"/>

  <!-- Glow bar at bottom -->
  <rect x="0" y="276" width="800" height="4" rx="2" fill="url(#accent)" opacity="0.5"/>

  <!-- Large floating orbs -->
  <circle class="orb1" cx="100" cy="70" r="100" fill="#6366f1" opacity="0.15"/>
  <circle class="orb2" cx="700" cy="200" r="120" fill="#8b5cf6" opacity="0.1"/>
  <circle class="orb3" cx="400" cy="230" r="70" fill="#a78bfa" opacity="0.12"/>
  <circle class="orb4" cx="550" cy="40" r="50" fill="#818cf8" opacity="0.08"/>

  <!-- Knowledge graph network (the hero visual) -->
  <!-- Connections first (behind nodes) -->
  <g class="conn">
    <!-- Central cluster -->
    <line x1="200" y1="80" x2="310" y2="60" stroke="#6366f1" stroke-width="0.8" opacity="0.12"/>
    <line x1="310" y1="60" x2="370" y2="120" stroke="#818cf8" stroke-width="0.8" opacity="0.1"/>
    <line x1="200" y1="80" x2="160" y2="150" stroke="#6366f1" stroke-width="0.8" opacity="0.08"/>
    <line x1="370" y1="120" x2="310" y2="180" stroke="#a78bfa" stroke-width="0.8" opacity="0.1"/>
    <line x1="160" y1="150" x2="310" y2="180" stroke="#818cf8" stroke-width="0.6" opacity="0.08"/>
    <!-- Right cluster -->
    <line x1="490" y1="70" x2="580" y2="110" stroke="#6366f1" stroke-width="0.8" opacity="0.1"/>
    <line x1="580" y1="110" x2="650" y2="60" stroke="#818cf8" stroke-width="0.8" opacity="0.08"/>
    <line x1="580" y1="110" x2="540" y2="180" stroke="#a78bfa" stroke-width="0.6" opacity="0.1"/>
    <line x1="490" y1="70" x2="540" y2="180" stroke="#6366f1" stroke-width="0.6" opacity="0.06"/>
    <!-- Cross connections -->
    <line x1="370" y1="120" x2="490" y2="70" stroke="#8b5cf6" stroke-width="0.6" opacity="0.06"/>
    <line x1="310" y1="180" x2="540" y2="180" stroke="#a78bfa" stroke-width="0.5" opacity="0.05"/>
  </g>

  <!-- Graph nodes -->
  <circle class="pulse" cx="200" cy="80" r="3" fill="#818cf8"/>
  <circle class="pulse2" cx="310" cy="60" r="4" fill="#6366f1"/>
  <circle class="pulse" cx="370" cy="120" r="3.5" fill="#a78bfa" style="animation-delay: 1s"/>
  <circle class="pulse2" cx="160" cy="150" r="2.5" fill="#818cf8" style="animation-delay: 0.5s"/>
  <circle class="pulse" cx="310" cy="180" r="3" fill="#6366f1" style="animation-delay: 3s"/>
  <circle class="pulse2" cx="490" cy="70" r="3.5" fill="#818cf8" style="animation-delay: 1.5s"/>
  <circle class="pulse" cx="580" cy="110" r="4" fill="#a78bfa" style="animation-delay: 2.5s"/>
  <circle class="pulse2" cx="650" cy="60" r="2.5" fill="#6366f1" style="animation-delay: 0.8s"/>
  <circle class="pulse" cx="540" cy="180" r="3" fill="#818cf8" style="animation-delay: 3.5s"/>

  <!-- Heartbeat signal rings -->
  <circle class="signal" cx="400" cy="140" r="30" fill="none" stroke="#6366f1" stroke-width="0.5"/>
  <circle class="signal" cx="400" cy="140" r="55" fill="none" stroke="#818cf8" stroke-width="0.3" style="animation-delay: 1s"/>
  <circle class="signal" cx="400" cy="140" r="80" fill="none" stroke="#a78bfa" stroke-width="0.2" style="animation-delay: 2s"/>

  <!-- Drifting particles -->
  <circle class="particle" cx="0" cy="90" r="1.5" fill="#818cf8" opacity="0"/>
  <circle class="particle" cx="0" cy="190" r="1" fill="#a78bfa" opacity="0" style="animation-delay: 5s"/>
  <circle class="particle" cx="0" cy="140" r="1.2" fill="#6366f1" opacity="0" style="animation-delay: 9s"/>

  <!-- Grid dots (top and bottom) -->
  <g opacity="0.06">
    <circle cx="50" cy="20" r="1" fill="#a78bfa"/><circle cx="100" cy="20" r="1" fill="#a78bfa"/>
    <circle cx="150" cy="20" r="1" fill="#a78bfa"/><circle cx="200" cy="20" r="1" fill="#a78bfa"/>
    <circle cx="250" cy="20" r="1" fill="#a78bfa"/><circle cx="300" cy="20" r="1" fill="#a78bfa"/>
    <circle cx="350" cy="20" r="1" fill="#a78bfa"/><circle cx="400" cy="20" r="1" fill="#a78bfa"/>
    <circle cx="450" cy="20" r="1" fill="#a78bfa"/><circle cx="500" cy="20" r="1" fill="#a78bfa"/>
    <circle cx="550" cy="20" r="1" fill="#a78bfa"/><circle cx="600" cy="20" r="1" fill="#a78bfa"/>
    <circle cx="650" cy="20" r="1" fill="#a78bfa"/><circle cx="700" cy="20" r="1" fill="#a78bfa"/>
    <circle cx="750" cy="20" r="1" fill="#a78bfa"/>
    <circle cx="50" cy="260" r="1" fill="#a78bfa"/><circle cx="100" cy="260" r="1" fill="#a78bfa"/>
    <circle cx="150" cy="260" r="1" fill="#a78bfa"/><circle cx="200" cy="260" r="1" fill="#a78bfa"/>
    <circle cx="250" cy="260" r="1" fill="#a78bfa"/><circle cx="300" cy="260" r="1" fill="#a78bfa"/>
    <circle cx="350" cy="260" r="1" fill="#a78bfa"/><circle cx="400" cy="260" r="1" fill="#a78bfa"/>
    <circle cx="450" cy="260" r="1" fill="#a78bfa"/><circle cx="500" cy="260" r="1" fill="#a78bfa"/>
    <circle cx="550" cy="260" r="1" fill="#a78bfa"/><circle cx="600" cy="260" r="1" fill="#a78bfa"/>
    <circle cx="650" cy="260" r="1" fill="#a78bfa"/><circle cx="700" cy="260" r="1" fill="#a78bfa"/>
    <circle cx="750" cy="260" r="1" fill="#a78bfa"/>
  </g>

  <!-- Title -->
  <text x="400" y="120" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Fira Code', Menlo, monospace"
        font-size="56" font-weight="700" fill="white" text-anchor="middle" letter-spacing="-1.5">
    keyoku
  </text>

  <!-- Tagline -->
  <text x="400" y="158" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="20" fill="#a5b4fc" text-anchor="middle" letter-spacing="0.5" opacity="0.9">
    Persistent Memory for AI Agents
  </text>

  <!-- Subtitle pills -->
  <g transform="translate(400, 200)" text-anchor="middle">
    <rect x="-230" y="-14" width="100" height="26" rx="13" fill="#6366f1" opacity="0.18"/>
    <text x="-180" y="5" font-family="ui-monospace, monospace" font-size="12" fill="#c4b5fd">Memory</text>

    <rect x="-110" y="-14" width="120" height="26" rx="13" fill="#6366f1" opacity="0.18"/>
    <text x="-50" y="5" font-family="ui-monospace, monospace" font-size="12" fill="#c4b5fd">Knowledge</text>

    <rect x="30" y="-14" width="110" height="26" rx="13" fill="#6366f1" opacity="0.18"/>
    <text x="85" y="5" font-family="ui-monospace, monospace" font-size="12" fill="#c4b5fd">Heartbeat</text>

    <rect x="160" y="-14" width="100" height="26" rx="13" fill="#6366f1" opacity="0.18"/>
    <text x="210" y="5" font-family="ui-monospace, monospace" font-size="12" fill="#c4b5fd">Autonomy</text>
  </g>

  <!-- Bottom tagline -->
  <text x="400" y="248" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="12" fill="#6366f1" text-anchor="middle" letter-spacing="3" opacity="0.5">
    REMEMBER EVERYTHING. ACT ON WHAT MATTERS.
  </text>
</svg>
