<svg xmlns="http://www.w3.org/2000/svg" width="1270" height="760" viewBox="0 0 1270 760">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=JetBrains+Mono:wght@400;600;700&amp;display=swap');
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#100b20" />
      <stop offset="50%" style="stop-color:#161035" />
      <stop offset="100%" style="stop-color:#0e0c1c" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1" />
      <stop offset="100%" style="stop-color:#a78bfa" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1270" height="760" fill="url(#bg)"/>
  <rect x="0" y="754" width="1270" height="6" fill="url(#accent)" opacity="0.5"/>

  <!-- Subtle orbs -->
  <circle cx="300" cy="400" r="200" fill="#6366f1" opacity="0.03"/>
  <circle cx="970" cy="400" r="200" fill="#8b5cf6" opacity="0.03"/>

  <!-- Title -->
  <text x="635" y="70" font-family="'Inter', ui-sans-serif, sans-serif"
        font-size="36" font-weight="600" fill="#e0e7ff" text-anchor="middle" letter-spacing="-0.5">
    Three Autonomy Levels
  </text>
  <text x="635" y="105" font-family="'Inter', ui-sans-serif, sans-serif"
        font-size="18" fill="#818cf8" text-anchor="middle" opacity="0.7">
    You control how far your agent goes
  </text>

  <!-- === Level 1: OBSERVE === -->
  <g transform="translate(80, 160)">
    <rect x="0" y="0" width="350" height="440" rx="14" fill="#1a1535" stroke="#2d2654" stroke-width="1.5"/>

    <!-- Level indicator -->
    <rect x="20" y="20" width="90" height="30" rx="15" fill="#6366f1" opacity="0.2"/>
    <text x="65" y="40" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" fill="#6366f1" text-anchor="middle" font-weight="600">LEVEL 1</text>

    <!-- Title -->
    <text x="175" y="100" font-family="'Inter', ui-sans-serif, sans-serif"
          font-size="28" font-weight="700" fill="#e0e7ff" text-anchor="middle">Observe</text>

    <!-- Icon: eye -->
    <circle cx="175" cy="160" r="30" fill="#6366f1" opacity="0.15"/>
    <circle cx="175" cy="160" r="12" fill="none" stroke="#6366f1" stroke-width="2"/>
    <circle cx="175" cy="160" r="4" fill="#6366f1"/>

    <!-- Description -->
    <text x="175" y="220" font-family="'Inter', ui-sans-serif, sans-serif" font-size="15" fill="#a5b4fc" text-anchor="middle">Silent memory</text>

    <line x1="40" y1="250" x2="310" y2="250" stroke="#2d2654" stroke-width="1"/>

    <text x="40" y="285" font-family="'Inter', ui-sans-serif, sans-serif" font-size="13" fill="#818cf8" opacity="0.8">Remembers everything</text>
    <text x="40" y="315" font-family="'Inter', ui-sans-serif, sans-serif" font-size="13" fill="#818cf8" opacity="0.8">Recalls context silently</text>
    <text x="40" y="345" font-family="'Inter', ui-sans-serif, sans-serif" font-size="13" fill="#818cf8" opacity="0.8">Captures facts automatically</text>
    <text x="40" y="375" font-family="'Inter', ui-sans-serif, sans-serif" font-size="13" fill="#818cf8" opacity="0.8">Never interrupts</text>

    <!-- Bar indicator -->
    <rect x="40" y="410" width="270" height="6" rx="3" fill="#1e1940"/>
    <rect x="40" y="410" width="90" height="6" rx="3" fill="#6366f1"/>
  </g>

  <!-- === Level 2: SUGGEST === -->
  <g transform="translate(460, 160)">
    <rect x="0" y="0" width="350" height="440" rx="14" fill="#1a1535" stroke="#818cf8" stroke-width="1.5"/>

    <!-- Level indicator -->
    <rect x="20" y="20" width="90" height="30" rx="15" fill="#818cf8" opacity="0.2"/>
    <text x="65" y="40" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" fill="#818cf8" text-anchor="middle" font-weight="600">LEVEL 2</text>

    <!-- Title -->
    <text x="175" y="100" font-family="'Inter', ui-sans-serif, sans-serif"
          font-size="28" font-weight="700" fill="#e0e7ff" text-anchor="middle">Suggest</text>

    <!-- Icon: lightbulb -->
    <circle cx="175" cy="160" r="30" fill="#818cf8" opacity="0.15"/>
    <circle cx="175" cy="155" r="10" fill="none" stroke="#818cf8" stroke-width="2"/>
    <line x1="170" y1="165" x2="180" y2="165" stroke="#818cf8" stroke-width="2"/>
    <line x1="171" y1="170" x2="179" y2="170" stroke="#818cf8" stroke-width="2"/>

    <!-- Description -->
    <text x="175" y="220" font-family="'Inter', ui-sans-serif, sans-serif" font-size="15" fill="#a5b4fc" text-anchor="middle">Surfaces insights</text>

    <line x1="40" y1="250" x2="310" y2="250" stroke="#2d2654" stroke-width="1"/>

    <text x="40" y="285" font-family="'Inter', ui-sans-serif, sans-serif" font-size="13" fill="#818cf8" opacity="0.8">Everything in Observe, plus:</text>
    <text x="40" y="315" font-family="'Inter', ui-sans-serif, sans-serif" font-size="13" fill="#a5b4fc">Surfaces relevant memories</text>
    <text x="40" y="345" font-family="'Inter', ui-sans-serif, sans-serif" font-size="13" fill="#a5b4fc">Flags stale or conflicting info</text>
    <text x="40" y="375" font-family="'Inter', ui-sans-serif, sans-serif" font-size="13" fill="#a5b4fc">Recommends actions</text>

    <!-- Bar indicator -->
    <rect x="40" y="410" width="270" height="6" rx="3" fill="#1e1940"/>
    <rect x="40" y="410" width="180" height="6" rx="3" fill="#818cf8"/>
  </g>

  <!-- === Level 3: ACT === -->
  <g transform="translate(840, 160)">
    <rect x="0" y="0" width="350" height="440" rx="14" fill="#1a1535" stroke="#a78bfa" stroke-width="1.5"/>

    <!-- Recommended badge -->
    <rect x="200" y="15" width="130" height="28" rx="14" fill="#a78bfa" opacity="0.2"/>
    <text x="265" y="34" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#a78bfa" text-anchor="middle" font-weight="600">RECOMMENDED</text>

    <!-- Level indicator -->
    <rect x="20" y="20" width="90" height="30" rx="15" fill="#a78bfa" opacity="0.2"/>
    <text x="65" y="40" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" fill="#a78bfa" text-anchor="middle" font-weight="600">LEVEL 3</text>

    <!-- Title -->
    <text x="175" y="100" font-family="'Inter', ui-sans-serif, sans-serif"
          font-size="28" font-weight="700" fill="#e0e7ff" text-anchor="middle">Act</text>

    <!-- Icon: lightning -->
    <circle cx="175" cy="160" r="30" fill="#a78bfa" opacity="0.15"/>
    <polygon points="180,142 170,162 178,162 172,180 185,155 176,155" fill="#a78bfa"/>

    <!-- Description -->
    <text x="175" y="220" font-family="'Inter', ui-sans-serif, sans-serif" font-size="15" fill="#c4b5fd" text-anchor="middle">Takes action independently</text>

    <line x1="40" y1="250" x2="310" y2="250" stroke="#2d2654" stroke-width="1"/>

    <text x="40" y="285" font-family="'Inter', ui-sans-serif, sans-serif" font-size="13" fill="#818cf8" opacity="0.8">Everything in Suggest, plus:</text>
    <text x="40" y="315" font-family="'Inter', ui-sans-serif, sans-serif" font-size="13" fill="#c4b5fd">Acts on heartbeat signals</text>
    <text x="40" y="345" font-family="'Inter', ui-sans-serif, sans-serif" font-size="13" fill="#c4b5fd">Resolves stale context</text>
    <text x="40" y="375" font-family="'Inter', ui-sans-serif, sans-serif" font-size="13" fill="#c4b5fd">Proactively engages</text>

    <!-- Bar indicator -->
    <rect x="40" y="410" width="270" height="6" rx="3" fill="#1e1940"/>
    <rect x="40" y="410" width="270" height="6" rx="3" fill="#a78bfa"/>
  </g>

  <!-- Bottom text -->
  <text x="635" y="680" font-family="'Inter', ui-sans-serif, sans-serif"
        font-size="16" fill="#a5b4fc" text-anchor="middle" opacity="0.6">
    Configure per-agent. Change anytime. No restart needed.
  </text>
</svg>
