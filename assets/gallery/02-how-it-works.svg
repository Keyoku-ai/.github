<svg xmlns="http://www.w3.org/2000/svg" width="1270" height="760" viewBox="0 0 1270 760">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=JetBrains+Mono:wght@400;600;700&amp;display=swap');
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#100b20" />
      <stop offset="50%" style="stop-color:#161035" />
      <stop offset="100%" style="stop-color:#0e0c1c" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1" />
      <stop offset="100%" style="stop-color:#a78bfa" />
    </linearGradient>
    <radialGradient id="pulseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.12" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1270" height="760" fill="url(#bg)"/>
  <rect x="0" y="754" width="1270" height="6" fill="url(#accent)" opacity="0.5"/>

  <!-- Subtle orbs -->
  <circle cx="200" cy="200" r="150" fill="#6366f1" opacity="0.03"/>
  <circle cx="1050" cy="550" r="120" fill="#8b5cf6" opacity="0.03"/>

  <!-- Title -->
  <text x="635" y="65" font-family="'Inter', ui-sans-serif, sans-serif"
        font-size="36" font-weight="600" fill="#e0e7ff" text-anchor="middle" letter-spacing="-0.5">
    How It Works
  </text>
  <text x="635" y="95" font-family="'Inter', ui-sans-serif, sans-serif"
        font-size="17" fill="#818cf8" text-anchor="middle" opacity="0.6">
    From conversation to autonomous action
  </text>

  <!-- === TOP ROW: Linear flow === -->
  <!-- Step 1: Conversation -->
  <rect x="60" y="140" width="220" height="110" rx="12" fill="#1a1535" stroke="#2d2654" stroke-width="1.5"/>
  <text x="170" y="175" font-family="'Inter', ui-sans-serif, sans-serif"
        font-size="16" font-weight="600" fill="#e0e7ff" text-anchor="middle">Conversation</text>
  <text x="170" y="200" font-family="'Inter', ui-sans-serif, sans-serif"
        font-size="12" fill="#818cf8" text-anchor="middle" opacity="0.7">Agent talks to user</text>
  <text x="170" y="220" font-family="'Inter', ui-sans-serif, sans-serif"
        font-size="12" fill="#818cf8" text-anchor="middle" opacity="0.7">Context flows in</text>

  <!-- Arrow -->
  <line x1="280" y1="195" x2="340" y2="195" stroke="#6366f1" stroke-width="1.5" opacity="0.4"/>
  <polygon points="340,190 355,195 340,200" fill="#6366f1" opacity="0.4"/>

  <!-- Step 2: Auto-Capture -->
  <rect x="355" y="140" width="220" height="110" rx="12" fill="#1a1535" stroke="#6366f1" stroke-width="1.5"/>
  <text x="465" y="175" font-family="'Inter', ui-sans-serif, sans-serif"
        font-size="16" font-weight="600" fill="#e0e7ff" text-anchor="middle">Auto-Capture</text>
  <text x="465" y="200" font-family="'Inter', ui-sans-serif, sans-serif"
        font-size="12" fill="#a5b4fc" text-anchor="middle" opacity="0.7">Facts extracted in real-time</text>
  <text x="465" y="220" font-family="'Inter', ui-sans-serif, sans-serif"
        font-size="12" fill="#a5b4fc" text-anchor="middle" opacity="0.7">Dedup + conflict detection</text>

  <!-- Arrow -->
  <line x1="575" y1="195" x2="635" y2="195" stroke="#818cf8" stroke-width="1.5" opacity="0.4"/>
  <polygon points="635,190 650,195 635,200" fill="#818cf8" opacity="0.4"/>

  <!-- Step 3: Memory Store -->
  <rect x="650" y="140" width="220" height="110" rx="12" fill="#1a1535" stroke="#818cf8" stroke-width="1.5"/>
  <text x="760" y="175" font-family="'Inter', ui-sans-serif, sans-serif"
        font-size="16" font-weight="600" fill="#e0e7ff" text-anchor="middle">Memory + Graph</text>
  <text x="760" y="200" font-family="'Inter', ui-sans-serif, sans-serif"
        font-size="12" fill="#a5b4fc" text-anchor="middle" opacity="0.7">Semantic search (HNSW+BM25)</text>
  <text x="760" y="220" font-family="'Inter', ui-sans-serif, sans-serif"
        font-size="12" fill="#a5b4fc" text-anchor="middle" opacity="0.7">Knowledge graph + decay</text>

  <!-- Arrow -->
  <line x1="870" y1="195" x2="930" y2="195" stroke="#a78bfa" stroke-width="1.5" opacity="0.4"/>
  <polygon points="930,190 945,195 930,200" fill="#a78bfa" opacity="0.4"/>

  <!-- Step 4: Auto-Recall -->
  <rect x="945" y="140" width="220" height="110" rx="12" fill="#1a1535" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="1055" y="175" font-family="'Inter', ui-sans-serif, sans-serif"
        font-size="16" font-weight="600" fill="#e0e7ff" text-anchor="middle">Auto-Recall</text>
  <text x="1055" y="200" font-family="'Inter', ui-sans-serif, sans-serif"
        font-size="12" fill="#c4b5fd" text-anchor="middle" opacity="0.7">Relevant memories injected</text>
  <text x="1055" y="220" font-family="'Inter', ui-sans-serif, sans-serif"
        font-size="12" fill="#c4b5fd" text-anchor="middle" opacity="0.7">before every interaction</text>

  <!-- Loop arrow from Auto-Recall back to Conversation -->
  <path d="M 1055,250 L 1055,275 Q 1055,290 1040,290 L 190,290 Q 170,290 170,275 L 170,250"
        fill="none" stroke="#6366f1" stroke-width="1.2" opacity="0.25" stroke-dasharray="6,4"/>
  <polygon points="165,252 170,242 175,252" fill="#6366f1" opacity="0.25"/>
  <text x="615" y="285" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#6366f1" text-anchor="middle" opacity="0.35">continuous loop</text>

  <!-- === DIVIDER === -->
  <line x1="100" y1="330" x2="1170" y2="330" stroke="#2d2654" stroke-width="1" opacity="0.4"/>
  <text x="635" y="365" font-family="'Inter', ui-sans-serif, sans-serif"
        font-size="22" font-weight="600" fill="#e0e7ff" text-anchor="middle">
    The Heartbeat: Memory to Action
  </text>

  <!-- === BOTTOM: Heartbeat system diagram === -->

  <!-- Center: Heartbeat engine -->
  <circle cx="635" cy="540" r="100" fill="url(#pulseGlow)"/>
  <circle cx="635" cy="540" r="50" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.2"/>
  <circle cx="635" cy="540" r="80" fill="none" stroke="#818cf8" stroke-width="0.6" opacity="0.12"/>
  <rect x="585" y="515" width="100" height="50" rx="10" fill="#1a1535" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="635" y="537" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" fill="#c4b5fd" text-anchor="middle" font-weight="600">Heartbeat</text>
  <text x="635" y="555" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#818cf8" text-anchor="middle">Engine</text>

  <!-- Left: Signal inputs -->
  <g transform="translate(80, 420)">
    <text x="130" y="0" font-family="'Inter', ui-sans-serif, sans-serif" font-size="14" font-weight="600" fill="#a5b4fc" text-anchor="middle">Signal Checks</text>

    <rect x="0" y="15" width="260" height="32" rx="6" fill="#1a1535" stroke="#2d2654" stroke-width="1"/>
    <circle cx="20" cy="31" r="4" fill="#ef4444" opacity="0.7"/>
    <text x="35" y="36" font-family="'Inter', ui-sans-serif, sans-serif" font-size="12" fill="#818cf8">Approaching deadlines</text>

    <rect x="0" y="55" width="260" height="32" rx="6" fill="#1a1535" stroke="#2d2654" stroke-width="1"/>
    <circle cx="20" cy="71" r="4" fill="#f59e0b" opacity="0.7"/>
    <text x="35" y="76" font-family="'Inter', ui-sans-serif, sans-serif" font-size="12" fill="#818cf8">Stale or conflicting context</text>

    <rect x="0" y="95" width="260" height="32" rx="6" fill="#1a1535" stroke="#2d2654" stroke-width="1"/>
    <circle cx="20" cy="111" r="4" fill="#8b5cf6" opacity="0.7"/>
    <text x="35" y="116" font-family="'Inter', ui-sans-serif, sans-serif" font-size="12" fill="#818cf8">Recurring patterns detected</text>

    <rect x="0" y="135" width="260" height="32" rx="6" fill="#1a1535" stroke="#2d2654" stroke-width="1"/>
    <circle cx="20" cy="151" r="4" fill="#3b82f6" opacity="0.7"/>
    <text x="35" y="156" font-family="'Inter', ui-sans-serif, sans-serif" font-size="12" fill="#818cf8">Sentiment shifts</text>

    <rect x="0" y="175" width="260" height="32" rx="6" fill="#1a1535" stroke="#2d2654" stroke-width="1"/>
    <circle cx="20" cy="191" r="4" fill="#22c55e" opacity="0.7"/>
    <text x="35" y="196" font-family="'Inter', ui-sans-serif, sans-serif" font-size="12" fill="#818cf8">Unresolved items</text>

    <rect x="0" y="215" width="260" height="32" rx="6" fill="#1a1535" stroke="#2d2654" stroke-width="1"/>
    <circle cx="20" cy="231" r="4" fill="#06b6d4" opacity="0.7"/>
    <text x="35" y="236" font-family="'Inter', ui-sans-serif, sans-serif" font-size="12" fill="#818cf8">Knowledge gaps</text>
  </g>

  <!-- Arrow: Signals to Heartbeat -->
  <line x1="380" y1="540" x2="575" y2="540" stroke="#818cf8" stroke-width="1.5" opacity="0.3"/>
  <polygon points="575,535 590,540 575,545" fill="#818cf8" opacity="0.3"/>
  <text x="480" y="530" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#818cf8" text-anchor="middle" opacity="0.4">SQL-driven</text>
  <text x="480" y="544" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#818cf8" text-anchor="middle" opacity="0.4">signal checks</text>

  <!-- Center: LLM Analysis -->
  <rect x="570" y="600" width="130" height="36" rx="8" fill="#1a1535" stroke="#6366f1" stroke-width="1"/>
  <text x="635" y="623" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#a5b4fc" text-anchor="middle">LLM Analysis</text>
  <line x1="635" y1="565" x2="635" y2="600" stroke="#6366f1" stroke-width="1" opacity="0.3"/>

  <!-- Right: Autonomy output -->
  <g transform="translate(920, 420)">
    <text x="140" y="0" font-family="'Inter', ui-sans-serif, sans-serif" font-size="14" font-weight="600" fill="#c4b5fd" text-anchor="middle">Autonomy Response</text>

    <rect x="0" y="20" width="260" height="65" rx="10" fill="#1a1535" stroke="#2d2654" stroke-width="1"/>
    <rect x="15" y="32" width="70" height="22" rx="11" fill="#6366f1" opacity="0.2"/>
    <text x="50" y="48" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#6366f1" text-anchor="middle">observe</text>
    <text x="100" y="48" font-family="'Inter', ui-sans-serif, sans-serif" font-size="12" fill="#818cf8" opacity="0.7">Log silently</text>

    <rect x="0" y="95" width="260" height="65" rx="10" fill="#1a1535" stroke="#818cf8" stroke-width="1"/>
    <rect x="15" y="107" width="70" height="22" rx="11" fill="#818cf8" opacity="0.2"/>
    <text x="50" y="123" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#818cf8" text-anchor="middle">suggest</text>
    <text x="100" y="123" font-family="'Inter', ui-sans-serif, sans-serif" font-size="12" fill="#818cf8" opacity="0.7">Surface to agent</text>

    <rect x="0" y="170" width="260" height="65" rx="10" fill="#1a1535" stroke="#a78bfa" stroke-width="1.5"/>
    <rect x="15" y="182" width="50" height="22" rx="11" fill="#a78bfa" opacity="0.25"/>
    <text x="40" y="198" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#a78bfa" text-anchor="middle">act</text>
    <text x="80" y="198" font-family="'Inter', ui-sans-serif, sans-serif" font-size="12" fill="#c4b5fd" opacity="0.8">Take action</text>
  </g>

  <!-- Arrow: Heartbeat to Autonomy -->
  <line x1="690" y1="540" x2="910" y2="540" stroke="#a78bfa" stroke-width="1.5" opacity="0.3"/>
  <polygon points="910,535 925,540 910,545" fill="#a78bfa" opacity="0.3"/>
  <text x="800" y="530" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#a78bfa" text-anchor="middle" opacity="0.4">LLM evaluates</text>
  <text x="800" y="544" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#a78bfa" text-anchor="middle" opacity="0.4">with knowledge graph</text>

  <!-- Bottom text -->
  <text x="635" y="710" font-family="'Inter', ui-sans-serif, sans-serif"
        font-size="14" fill="#6366f1" text-anchor="middle" opacity="0.4" letter-spacing="2">
    YOUR DATA NEVER LEAVES YOUR MACHINE
  </text>
</svg>
